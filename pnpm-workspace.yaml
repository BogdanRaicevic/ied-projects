packages:
  - ied-be
  - ied-fe
  - ied-shared
  - mongo-migrator

catalog:
  typescript: ^7.0.2
  "@biomejs/biome": ^2.6.6
  "@types/node": ^26.6.6
  zod: ^4.6.7
  tsx: ^4.23.15
  globals: ^17.14.0
  date-fns: ^4.4.0
  es-toolkit: ^1.53.2
  vitest: ^5.1.0
  "@vitest/coverage-v8": ^5.1.0
  dotenv: ^18.0.10
  mongoose: ^9.12.1

allowBuilds:
  '@clerk/shared': true
  mongodb-memory-server: true
  puppeteer: true
  esbuild: false
overrides:
  # TODO (low priority): remove once @semantic-release/release-notes-generator
  # ships a stable version depending on conventional-changelog-writer@9 (15.0.0
  # is in beta). Until then this forces writer 9, which the
  # conventionalcommits@10 preset needs. Alternative: replace semantic-release
  # with release-please and drop the override with it.
  "@semantic-release/release-notes-generator>conventional-changelog-writer": ^9.3.0
